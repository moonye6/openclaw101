name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint • Typecheck • Validate • Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Lint structure
        run: pnpm lint:structure

      - name: Check dynamic-route 404 guards
        run: pnpm check:routes

      - name: Check internal blog links
        run: pnpm check:links

      - name: Check blog article consistency
        run: pnpm check:blog

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.sha }}
          path: |
            .next
            !.next/cache
          retention-days: 3
          if-no-files-found: ignore

  e2e:
    name: Playwright E2E (preview build)
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Run E2E (Playwright webServer spawns pnpm start)
        run: BASE_URL=http://localhost:3000 pnpm exec playwright test
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
